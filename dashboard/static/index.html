<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Content OS · Control Center</title>
<style>
:root{
  --bg:#070b10; --bg2:#0a1017; --panel:#0e151e; --panel2:#131c27; --line:#1d2a38; --line2:#2a3a4e;
  --text:#e6edf3; --muted:#8b9bb0; --dim:#5b6b80;
  --accent:#3ee6a8; --accent2:#1fb888; --blue:#58a6ff; --amber:#f2b441; --red:#ff6b6b; --violet:#b692ff; --orange:#e9a86b;
  --mono: ui-monospace, "Cascadia Code", "JetBrains Mono", Consolas, monospace;
  --sans: "Segoe UI", system-ui, -apple-system, Roboto, sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:radial-gradient(1200px 600px at 70% -10%,#0f2230 0%,transparent 60%),var(--bg);color:var(--text);font:14px/1.5 var(--sans);display:flex;flex-direction:column;overflow:hidden}
button{font:inherit;cursor:pointer;border:0;border-radius:8px}
input,textarea{font:inherit;color:var(--text);background:var(--bg);border:1px solid var(--line2);border-radius:8px;padding:10px 12px;width:100%}
input:focus,textarea:focus{outline:2px solid var(--accent2);border-color:transparent}
a{color:var(--blue)}
.mono{font-family:var(--mono)} .muted{color:var(--muted)} .dim{color:var(--dim)}
.btn{background:var(--accent);color:#04150e;font-weight:650;padding:9px 16px}
.btn:hover{background:#63f0bd}
.btn.ghost{background:transparent;color:var(--text);border:1px solid var(--line2)} .btn.ghost:hover{border-color:var(--muted)}
.btn.danger{background:transparent;color:var(--red);border:1px solid #5a2a2e} .btn.danger:hover{background:#2a1417}
.btn.sm{padding:5px 10px;font-size:12.5px}
.chip{display:inline-flex;align-items:center;gap:6px;font:12px var(--mono);padding:2px 8px;border-radius:999px;background:var(--panel2);border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.chip.ev{color:#9fc3ff;border-color:#23405f;background:#0f1d2c}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px}
h1,h2,h3{margin:0;font-weight:650} h2{font-size:17px} h3{font-size:14px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap} .grow{flex:1}
.spin{width:14px;height:14px;border-radius:50%;border:2px solid var(--line2);border-top-color:var(--blue);animation:sp .8s linear infinite;display:inline-block}
@keyframes sp{to{transform:rotate(360deg)}}
.sect{margin:16px 0 8px;font:600 11.5px var(--mono);color:var(--muted);text-transform:uppercase;letter-spacing:.08em}

/* ---- top bar ---- */
.top{display:flex;align-items:center;gap:14px;padding:10px 18px;border-bottom:1px solid var(--line);background:#0a1118cc;backdrop-filter:blur(6px)}
.brand{font:700 16px var(--mono);color:var(--accent);white-space:nowrap} .brand span{color:var(--dim);font-weight:400}
select{background:var(--panel);color:var(--text);border:1px solid var(--line2);border-radius:8px;padding:7px 10px;font:13px var(--mono);max-width:360px}
.mode{display:flex;border:1px solid var(--line2);border-radius:9px;overflow:hidden}
.mode button{background:transparent;color:var(--muted);padding:6px 12px;border-radius:0;font-size:13px}
.mode button.on{background:#123326;color:var(--accent)} .mode button.on.man{background:#2b2210;color:var(--amber)}
.cc{display:flex;align-items:center;gap:7px;font:12px var(--mono);color:var(--muted)}
.led{width:8px;height:8px;border-radius:50%;background:var(--red)} .led.ok{background:var(--accent);box-shadow:0 0 8px var(--accent)}
.stats{display:flex;gap:16px;font:12px var(--mono);color:var(--muted)} .stats b{color:var(--text)}

/* ---- layout ---- */
.body{flex:1;overflow:auto;padding:18px}
.wrap{max-width:1600px;margin:0 auto}
.floor-grid{display:grid;grid-template-columns:minmax(0,1fr) 420px;gap:16px;margin-bottom:16px}
@media (max-width:1250px){.floor-grid{grid-template-columns:1fr}}

/* ---- agent floor ---- */
.floor{position:relative;background:linear-gradient(180deg,#0b131c,#081018);border:1px solid var(--line);border-radius:16px;padding:14px 14px 8px;overflow:hidden}
.floor:before{content:"";position:absolute;inset:0;background-image:linear-gradient(#ffffff06 1px,transparent 1px),linear-gradient(90deg,#ffffff06 1px,transparent 1px);background-size:28px 28px;pointer-events:none}
.floor-head{display:flex;align-items:center;gap:10px;position:relative}
.floor-head h1{font:700 18px var(--mono)} .floor-head .src{color:var(--muted);font-size:12.5px;word-break:break-all}
.pill{font:600 11.5px var(--mono);padding:4px 10px;border-radius:999px;border:1px solid var(--line2);text-transform:uppercase;letter-spacing:.05em;white-space:nowrap}
.pill.done{color:var(--accent);border-color:#1d5c46} .pill.gate{color:var(--violet);border-color:#4b3b73}
.pill.waiting{color:var(--amber);border-color:#6b5320} .pill.failed{color:var(--red);border-color:#6b2a2e}
.pill.running{color:var(--blue);border-color:#264a73} .pill.rejected{color:var(--muted)}
svg.net{width:100%;height:auto;display:block;position:relative}
.edge{stroke:#243447;stroke-width:3;fill:none}
.edge.lit{stroke:#1fb888}
.edge.hot{stroke:#2d5f96;stroke-dasharray:6 8;animation:flow 0.7s linear infinite}
@keyframes flow{to{stroke-dashoffset:-14}}
.pod{cursor:pointer}
.pod .disc{fill:#0c141d;stroke:#2a3a4e;stroke-width:2.5}
.pod .ring{fill:none;stroke:transparent;stroke-width:3}
.pod text{font-family:var(--mono);text-anchor:middle}
.pod .t1{font-size:14px;font-weight:700;fill:#8b9bb0} .pod .t2{font-size:13px;font-weight:600;fill:#e6edf3;font-family:var(--sans)}
.pod .t3{font-size:11px;fill:#5b6b80} .pod .who{font-size:10px}
.pod:hover .disc{stroke:#8b9bb0}
.pod.success .disc,.pod.done .disc{stroke:#1fb888;fill:#0b1a14} .pod.success .t1,.pod.done .t1{fill:#3ee6a8}
.pod.running .disc{stroke:#58a6ff;fill:#0c1a2a} .pod.running .t1{fill:#58a6ff}
.pod.running .ring{stroke:#58a6ff;stroke-dasharray:18 12;animation:spin 1.4s linear infinite;transform-box:fill-box;transform-origin:center}
@keyframes spin{to{transform:rotate(360deg)}}
.pod.waiting .disc{stroke:#f2b441;fill:#1d170b} .pod.waiting .t1{fill:#f2b441}
.pod.gate .disc{stroke:#b692ff;fill:#161026} .pod.gate .t1{fill:#b692ff}
.pod.gate .ring,.pod.waiting .ring{stroke:currentColor;animation:breathe 1.6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.pod.gate{color:#b692ff} .pod.waiting{color:#f2b441}
@keyframes breathe{50%{transform:scale(1.18);opacity:0}}
.pod.failed .disc{stroke:#ff6b6b;fill:#1e0f11} .pod.failed .t1{fill:#ff6b6b}
.pod.skipped .disc{stroke-dasharray:5 5} .pod.cancelled{opacity:.3}
.pod.sel .disc{stroke-width:4}
.halo{fill:url(#halo);opacity:0} .pod.running .halo{opacity:1}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--dim);position:relative;padding:2px 4px 4px}
.legend i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px;vertical-align:-1px}

/* ---- live feed ---- */
.feed{display:flex;flex-direction:column;background:#060a0f;border:1px solid var(--line);border-radius:16px;overflow:hidden;min-height:420px;max-height:560px}
.feed-head{display:flex;align-items:center;gap:8px;padding:10px 14px;border-bottom:1px solid var(--line);background:#0a1118}
.dots i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px;background:#2a3a4e} .dots i:nth-child(1){background:#ff5f57}.dots i:nth-child(2){background:#febc2e}.dots i:nth-child(3){background:#28c840}
.feed-head b{font:600 12.5px var(--mono)}
.stream{flex:1;overflow:auto;padding:12px 14px;font:12px/1.55 var(--mono);color:#9fe8c8;white-space:pre-wrap;word-break:break-word}
.stream .cur{display:inline-block;width:7px;height:14px;background:var(--accent);vertical-align:-2px;animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:0}}
.log{border-top:1px solid var(--line);max-height:200px;overflow:auto;padding:8px 14px;font:11.5px/1.7 var(--mono);color:var(--muted);background:#080d13}
.log .ok{color:var(--accent)} .log .bad{color:var(--red)} .log .wait{color:var(--amber)} .log .t{color:var(--dim)}

/* ---- panels ---- */
.action{margin-bottom:16px;border-left-width:4px}
.action.waiting{border-left-color:var(--amber)} .action.gate{border-left-color:var(--violet)} .action.failed{border-left-color:var(--red)}
.action.done{border-left-color:var(--accent)} .action.running{border-left-color:var(--blue)}
.steps{counter-reset:s;display:grid;gap:10px;margin-top:12px}
.step{display:flex;gap:12px;align-items:flex-start}
.step:before{counter-increment:s;content:counter(s);flex:none;width:24px;height:24px;border-radius:50%;background:var(--panel2);border:1px solid var(--line2);display:grid;place-items:center;font:12px var(--mono);color:var(--muted)}
textarea.resp{min-height:120px;font:12.5px var(--mono)}
.rec{display:flex;gap:14px;align-items:flex-start;background:linear-gradient(90deg,#1a1330,#0e151e);border:1px solid #4b3b73;border-radius:12px;padding:14px;margin-top:12px}
.rec .badge{font:700 11px var(--mono);color:#1a0f33;background:var(--violet);padding:3px 8px;border-radius:6px;white-space:nowrap}
.angles{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:12px;margin-top:14px}
.angle{position:relative;background:var(--bg2);border:1px solid var(--line2);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:8px}
.angle.recd{border-color:var(--violet);box-shadow:0 0 0 1px #b692ff55,0 8px 30px #b692ff14}
.angle .ribbon{position:absolute;top:-10px;right:12px;font:700 10.5px var(--mono);background:var(--violet);color:#1a0f33;padding:2px 8px;border-radius:6px}
.conf{display:flex;align-items:center;gap:12px}
.gauge{--p:50;width:58px;height:58px;border-radius:50%;background:conic-gradient(var(--c,#3ee6a8) calc(var(--p)*1%),#1d2a38 0);display:grid;place-items:center;flex:none}
.gauge span{width:46px;height:46px;border-radius:50%;background:var(--bg2);display:grid;place-items:center;font:700 13px var(--mono)}
.angle .ttl{font-weight:650;line-height:1.35}
.angle .hook{color:#cfe3ff;font-style:italic;border-left:3px solid #2d4a6b;padding-left:10px;font-size:13.5px}
.angle .why{font-size:12.5px;color:var(--muted)}
.review{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:16px;margin-top:14px}
@media (max-width:1100px){.review{grid-template-columns:1fr}}
.li{background:#fff;color:#1d2226;border-radius:12px;padding:14px 16px;font:14px/1.45 -apple-system,"Segoe UI",Roboto,sans-serif}
.li .who2{display:flex;gap:10px;align-items:center;margin-bottom:10px}
.li .av{width:44px;height:44px;border-radius:50%;background:linear-gradient(135deg,#0a66c2,#3ee6a8);display:grid;place-items:center;color:#fff;font-weight:700}
.li .nm2{font-weight:600} .li .hl{font-size:12px;color:#666}
.li .body{white-space:pre-wrap;word-wrap:break-word} .li .tag2{color:#0a66c2;font-weight:600}
.li img{width:100%;border-radius:6px;margin-top:10px;display:block}
.meter{height:8px;background:var(--panel2);border-radius:99px;position:relative;overflow:hidden;margin:6px 0 2px}
.meter i{position:absolute;top:0;left:0;bottom:0;background:var(--accent)} .meter b{position:absolute;top:-2px;bottom:-2px;width:2px;background:var(--amber)}
.bar{height:6px;background:var(--panel2);border-radius:99px;overflow:hidden} .bar>i{display:block;height:100%;background:linear-gradient(90deg,var(--accent2),var(--accent))}
.score5{display:grid;grid-template-columns:70px 1fr 30px;gap:8px;align-items:center;font-size:13px}
.flag{border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--bg2)}
.sev{font:700 11px var(--mono);text-transform:uppercase;padding:1px 7px;border-radius:6px}
.sev.block{background:#3a1216;color:var(--red)} .sev.fix{background:#33270c;color:var(--amber)} .sev.nit{background:var(--panel2);color:var(--muted)}
.q{font-family:var(--mono);font-size:12.5px;color:#cfe3ff;background:#0f1d2c;border-radius:6px;padding:2px 6px}
.studio{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:16px}
@media (max-width:1100px){.studio{grid-template-columns:1fr}}
canvas.gfx{width:100%;height:auto;border-radius:10px;border:1px solid var(--line2);display:block}
.prompt-box{background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:10px}
.prompt-box p{margin:6px 0 8px;font-size:12.5px;color:#c4cfdc;white-space:pre-wrap}
.kit{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-top:12px}
@media (max-width:1200px){.kit{grid-template-columns:1fr 1fr}}
.kitbox{background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:8px;min-width:0}
.kitbox .n{font:700 11px var(--mono);color:var(--accent);letter-spacing:.06em}
.kitbox pre{margin:0;font:12.5px/1.45 var(--sans);color:#c4cfdc;white-space:pre-wrap;max-height:120px;overflow:hidden;mask-image:linear-gradient(#000 70%,transparent)}
.kitbox img{width:100%;border-radius:8px;border:1px solid var(--line2)}
.kitpath{font:12px var(--mono);color:var(--muted);word-break:break-all}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.tab{background:transparent;color:var(--muted);border:1px solid var(--line);padding:5px 10px;font:12px var(--mono)}
.tab.on{color:var(--text);border-color:var(--blue);background:#0d1826} .tab:disabled{opacity:.35}
.grid2{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:12px}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-bottom:14px}
.tile{background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.tile .n{font:700 18px var(--mono);word-break:break-all} .tile .l{font-size:11px;color:var(--dim);text-transform:uppercase;letter-spacing:.06em}
.find{background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:12px}
.find b{display:block;margin-bottom:4px} .find p{margin:0 0 8px;color:#c4cfdc;font-size:13px}
.beats{display:grid;gap:8px} .beat{display:flex;gap:10px} .beat span{flex:none;width:22px;height:22px;border-radius:50%;background:#15283a;color:var(--blue);display:grid;place-items:center;font:12px var(--mono)}
pre.json{background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:12px;overflow:auto;max-height:480px;font:12px/1.45 var(--mono);color:#c4cfdc;margin:0}
.tree{columns:2;font:12px/1.6 var(--mono);color:var(--muted);max-height:320px;overflow:auto;background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.hero{max-width:980px;margin:30px auto 0;text-align:center}
.hero h1{font-size:28px} .hero p{color:var(--muted);margin:8px 0 0}
.drop{margin-top:24px;border:2px dashed var(--line2);border-radius:18px;padding:48px 20px;text-align:center;background:linear-gradient(180deg,#0e1822,#0a121a);transition:.15s}
.drop.over{border-color:var(--accent);background:#0f2019;box-shadow:0 0 0 6px #3ee6a811}
.drop .big{font-size:19px;font-weight:650} .drop .sub{color:var(--muted);margin-top:6px}
.or{display:flex;align-items:center;gap:12px;color:var(--dim);margin:22px 0;font-size:12px}
.or:before,.or:after{content:"";flex:1;height:1px;background:var(--line)}
.how{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:26px;text-align:left}
.toast{position:fixed;bottom:20px;right:20px;background:#2a1417;border:1px solid #6b2a2e;color:#ffd0d0;padding:12px 16px;border-radius:10px;max-width:480px;z-index:9;display:none}
.toast.ok{background:#0c1a15;border-color:#1d5c46;color:#bff5dd}
.empty{color:var(--dim);padding:10px 0}
</style>
</head>
<body>
<div class="top">
  <div class="brand">&gt;_ content-os <span>control center</span></div>
  <select id="runSel" onchange="go(this.value || null)"></select>
  <button class="btn sm" onclick="go(null)">+ New run</button>
  <span class="grow"></span>
  <div class="stats" id="stats"></div>
  <div class="mode" id="mode"></div>
  <div class="cc" id="cc"></div>
</div>
<div class="body"><div class="wrap" id="view"></div></div>
<div class="toast" id="toast"></div>

<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const S = {runs: [], cur: null, d: null, sel: null, memory: null, settings: null, timer: null, gstyle: null, mem: false};
const SHORT = {A01:"ingest",A02:"memory",A03:"analyze",A04:"angles",G1:"pick",A05:"strategy",A06:"visuals",A07:"write",A08:"critique",A09:"revise",A10:"package",G2:"approve",A11:"save"};
const STLABEL = {pending:"idle", running:"working", success:"done", done:"done", waiting:"needs Claude", gate:"your turn", failed:"failed", skipped:"skipped", cancelled:"—"};

async function api(path, opt = {}) {
  const r = await fetch(path, opt); const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.error || r.statusText); return j;
}
const post = (p, body) => api(p, {method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify(body || {})});
function toast(msg, ok) { const t = $("#toast"); t.textContent = msg; t.className = "toast" + (ok ? " ok" : ""); t.style.display = "block"; clearTimeout(t._h); t._h = setTimeout(() => t.style.display = "none", ok ? 2500 : 8000); }
function go(id) { S.cur = id; S.d = null; S.sel = null; S.mem = false; S.gstyle = null; history.replaceState(null, "", id ? "#" + id : "#"); render(); refresh(); }
const since = iso => { const t = Date.parse(iso); if (!t) return ""; const s = Math.max(0, Math.round((Date.now() - t) / 1000)); return s < 60 ? s + "s" : Math.floor(s / 60) + "m " + (s % 60) + "s"; };

async function refresh() {
  clearTimeout(S.timer);
  try {
    [S.runs, S.memory, S.settings] = await Promise.all([api("/api/runs"), api("/api/memory"), api("/api/settings")]);
    if (S.cur) { try { S.d = await api("/api/runs/" + encodeURIComponent(S.cur)); } catch (e) { S.d = {starting: true}; } }
  } catch (e) { toast("Dashboard server not reachable: " + e.message); }
  render();
  const active = (S.d && (S.d.busy || S.d.starting)) || S.runs.some(r => r.busy);
  S.timer = setTimeout(refresh, active ? 900 : 4000);
}

/* ---------------- top bar ---------------- */
function renderTop() {
  const sel = $("#runSel");
  const opts = [`<option value="">— select a run (${S.runs.length}) —</option>`].concat(S.runs.map(r => {
    const lab = r.busy ? "working" : r.gate ? (r.gate === "G1" ? "pick angle" : "review") : r.status;
    return `<option value="${esc(r.run_id)}" ${r.run_id === S.cur ? "selected" : ""}>${esc(r.run_id)} · ${esc(lab)}</option>`;
  })).join("");
  if (sel.innerHTML !== opts && document.activeElement !== sel) sel.innerHTML = opts;
  const m = S.memory?.counts || {};
  $("#stats").innerHTML = `<span>posts <b>${m.posts ?? 0}</b></span><span>queued angles <b>${m.queued ?? 0}</b></span><a href="#" onclick="S.mem=true;render();return false">memory</a>`;
  const st = S.settings || {}; const mode = st.mode;
  $("#mode").innerHTML = mode === "mock" ? `<button class="on">mock (tests)</button>` :
    `<button class="${mode === "auto" ? "on" : ""}" onclick="setMode('auto')" title="Claude Code runs every Claude stage automatically">Auto · Claude Code</button>
     <button class="${mode === "manual" ? "on man" : ""}" onclick="setMode('manual')" title="You paste prompts into Claude yourself">Manual</button>`;
  const c = st.claude || {};
  $("#cc").innerHTML = `<span class="led ${c.found ? "ok" : ""}"></span>${c.found ? esc(c.version || "Claude Code") : "Claude Code not found"}`;
}
async function setMode(m) { try { S.settings = await post("/api/settings", {mode: m}); toast(m === "auto" ? "Auto: Claude Code runs the Claude stages." : "Manual: you hand prompts to Claude.", true); render(); } catch (e) { toast(e.message); } }

/* ---------------- new run ---------------- */
function renderNew() {
  const auto = S.settings?.mode === "auto";
  return `<div class="hero"><h1>Drop a repo. Watch the agents work.</h1>
    <p>${auto ? "Auto mode: Claude Code runs every Claude stage on this PC. You only step in to pick the angle and approve the post." : "Manual mode: you hand each Claude stage's prompt to Claude yourself. Switch to Auto (top right) for a hands-free run."}</p>
    <div class="drop" id="drop"><div class="big">Drop a .zip here</div>
      <div class="sub">or <a href="#" onclick="$('#file').click();return false">choose a file</a> · GitHub: Code → Download ZIP</div>
      <input type="file" id="file" accept=".zip" style="display:none" onchange="uploadFile(this.files[0])"></div>
    <div class="or">OR PASTE A URL</div>

function wireDrop() {
  const d = $("#drop"); if (!d) return;
  ["dragenter", "dragover"].forEach(e => d.addEventListener(e, ev => { ev.preventDefault(); d.classList.add("over"); }));
  ["dragleave", "drop"].forEach(e => d.addEventListener(e, ev => { ev.preventDefault(); d.classList.remove("over"); }));

}
async function uploadFile(f) {
  if (!f) return; if (!f.name.toLowerCase().endsWith(".zip")) return toast("Only .zip files. On GitHub: Code → Download ZIP.");
  toast(`Uploading ${f.name} (${(f.size / 1048576).toFixed(1)} MB)…`, true);
  try { const r = await api("/api/upload?name=" + encodeURIComponent(f.name), {method: "POST", body: f}); go(r.run_id); } catch (e) { toast(e.message); }
}
async function startUrl() {
  const s = $("#src").value.trim(); if (!s) return toast("Paste a GitHub URL or zip URL first.");
  try { const r = await post("/api/runs", {source: s}); go(r.run_id); } catch (e) { toast(e.message); }
}

/* ---------------- agent network ---------------- */
const POS = (() => { const p = {}; const r1 = ["A01","A02","A03","A04","G1","A05","A06"], r2 = ["A07","A08","A09","A10","G2","A11"];
  r1.forEach((t, i) => p[t] = [80 + i * 173, 86]); r2.forEach((t, i) => p[t] = [1118 - i * 173, 250]); return p; })();
function renderNet(stages) {
  const by = Object.fromEntries(stages.map(s => [s.tag, s]));
  const order = stages.map(s => s.tag);
  const lit = t => ["success", "done", "skipped"].includes(by[t].status);
  let edges = "";
  for (let i = 1; i < order.length; i++) {
    const a = POS[order[i - 1]], b = POS[order[i]];
    const d = a[1] === b[1] ? `M${a[0]},${a[1]} L${b[0]},${b[1]}` : `M${a[0]},${a[1]} C${a[0] + 72},${a[1]} ${b[0] + 72},${b[1]} ${b[0]},${b[1]}`;
    const tgt = by[order[i]].status; const hot = lit(order[i - 1]) && ["running", "waiting", "gate"].includes(tgt);
    edges += `<path id="e${i}" class="edge ${lit(order[i]) ? "lit" : hot ? "hot" : ""}" d="${d}"/>`;
    if (hot) edges += [0, 0.6, 1.2].map(b => `<circle r="4" fill="${tgt === "running" ? "#58a6ff" : tgt === "gate" ? "#b692ff" : "#f2b441"}"><animateMotion dur="1.8s" begin="${b}s" repeatCount="indefinite"><mpath href="#e${i}"/></animateMotion></circle>`).join("");
  }
  const pods = stages.map(s => {
    const [x, y] = POS[s.tag]; const gate = s.tag.startsWith("G");
    const whoC = s.who === "claude" ? "#e9a86b" : s.who === "you" ? "#b692ff" : "#5b6b80";
    const time = s.status === "running" && S.d?.live ? since(S.d.live.since) : (s.ms != null && s.status !== "waiting" ? (s.ms < 1000 ? s.ms + "ms" : (s.ms / 1000).toFixed(1) + "s") : "");
    return `<g class="pod ${s.status} ${S.sel === s.tag ? "sel" : ""}" onclick="selTag('${s.tag}')"><title>${esc(s.tag + " " + s.name + ": " + s.what)}</title>
      <circle class="halo" cx="${x}" cy="${y}" r="62"/>
      ${gate ? `<g transform="rotate(45 ${x} ${y})"><rect class="disc" x="${x - 36}" y="${y - 36}" width="72" height="72" rx="18"/>
                <rect class="ring" x="${x - 42}" y="${y - 42}" width="84" height="84" rx="20"/></g>`
             : `<circle class="disc" cx="${x}" cy="${y}" r="38"/><circle class="ring" cx="${x}" cy="${y}" r="45"/>`}
      <text class="t1" x="${x}" y="${y - 4}">${s.tag}</text>
      <text class="who" x="${x}" y="${y + 13}" fill="${whoC}">${s.who}</text>
      <text class="t2" x="${x}" y="${y + 62}">${SHORT[s.tag]}</text>
      <text class="t3" x="${x}" y="${y + 77}">${STLABEL[s.status] || s.status}${time ? " · " + time : ""}</text></g>`;
  }).join("");
  return `<svg class="net" viewBox="0 0 1200 345"><defs><radialGradient id="halo"><stop offset="0" stop-color="#58a6ff" stop-opacity=".28"/><stop offset="1" stop-color="#58a6ff" stop-opacity="0"/></radialGradient></defs>${edges}${pods}</svg>
    <div class="legend"><span><i style="background:var(--accent)"></i>done</span><span><i style="background:var(--blue)"></i>working</span><span><i style="background:var(--amber)"></i>needs Claude</span><span><i style="background:var(--violet)"></i>your turn</span><span><i style="background:var(--red)"></i>failed</span><span>circle = agent · diamond = you · click any node to inspect it</span></div>`;
}
function selTag(t) { S.sel = S.sel === t ? null : t; render(); setTimeout(() => $("#inspect")?.scrollIntoView({behavior: "smooth", block: "start"}), 30); }

/* ---------------- live feed + log ---------------- */
function renderFeed(d) {
  const lv = d.live, s = d.summary;
  let head, body;
  if (lv && d.busy) {
    head = `<b style="color:var(--blue)">${esc(lv.tag)} ${esc(lv.name)}</b><span class="dim mono" style="font-size:12px">· writing · ${since(lv.since)} · ${lv.chars.toLocaleString()} chars</span>`;
    body = lv.text ? esc(lv.text) + '<span class="cur"></span>' : `<span class="dim">${lv.tag >= "A03" ? "Claude is thinking…" : "working…"}</span> <span class="cur"></span>`;
  } else if (d.busy) {
    const cur = d.stages.find(x => x.status === "running");
    head = `<b style="color:var(--blue)">${esc(cur?.tag || "")} ${esc(cur?.name || "")}</b><span class="dim mono" style="font-size:12px">· running</span>`;
    body = `<span class="dim">${esc(cur?.what || "")}</span> <span class="cur"></span>`;
  } else if (s.status === "waiting") {
    head = `<b style="color:var(--amber)">${esc(d.pending?.[0] || "")} waiting for Claude</b>`;
    body = `<span style="color:var(--amber)">Manual mode: hand the prompt to Claude (panel below), or switch to Auto and press Resume.</span>`;
  } else if (s.gate) {
    head = `<b style="color:var(--violet)">${s.gate} · your turn</b>`;
    body = `<span style="color:#d7c6ff">${s.gate === "G1" ? "The agents proposed angles. Claude's pick and the confidence of each are below." : "The post is ready. Review it, check the visuals, then approve or reject."}</span>`;
  } else {
    const last = [...d.stages].reverse().find(x => x.status !== "pending" && x.status !== "cancelled");
    head = `<b>${esc(s.status)}</b>`;
    body = last && lv?.text ? esc(lv.text) : `<span class="dim">Idle. Last step: ${esc(last?.tag || "—")}</span>`;
  }
  const log = (d.events || []).map(e => {
    const t = (e.at || "").slice(11, 19);
    if (e.kind === "llm") {
      const cls = e.ok ? "ok" : e.waiting ? "wait" : "bad";
      const what = e.waiting ? "prompt ready, waiting for Claude" : e.ok ? `answer ok${e.repaired ? " (after 1 repair)" : ""}` : `error: ${esc(e.error || "")}`;
      return `<div><span class="t">${t}</span> <b>${esc(e.tag)}</b> <span class="${cls}">${e.backend}${e.model ? "/" + esc(e.model) : ""} · ${what}</span>${e.ms != null && !e.waiting ? ` <span class="t">${(e.ms / 1000).toFixed(1)}s</span>` : ""}</div>`;
    }
    const cls = e.status === "success" ? "ok" : e.status === "failed" ? "bad" : "wait";
    return `<div><span class="t">${t}</span> <b>${esc(e.tag)}</b> <span class="${cls}">${esc(e.status)}</span> <span class="t">${e.ms != null ? (e.ms / 1000).toFixed(1) + "s" : ""}</span>${e.error && e.status === "failed" ? ` <span class="bad">${esc(e.error)}</span>` : ""}</div>`;
  }).join("") || `<div class="t">no activity yet</div>`;
  return `<div class="feed"><div class="feed-head"><span class="dots"><i></i><i></i><i></i></span>${head}</div>
    <div class="stream" id="stream">${body}</div><div class="log" id="log">${log}</div></div>`;
}

/* ---------------- action panels ---------------- */
function renderAction(d) {
  const s = d.summary, st = d.stages;
  if (d.error) return `<div class="card action failed"><h3 style="color:var(--red)">Last action failed</h3><p class="mono" style="margin:8px 0 12px;white-space:pre-wrap">${esc(d.error)}</p><button class="btn ghost" onclick="act('resume')">Retry</button></div>`;
  if (d.busy || d.starting) return "";
  if (s.status === "waiting") return renderWaiting(d);
  if (s.gate === "G1") return renderG1(s);
  if (s.gate === "G2") return renderG2(d);
  if (s.status === "failed") {
    const f = st.find(x => x.status === "failed");
    return `<div class="card action failed"><h3 style="color:var(--red)">${esc(f?.tag)} ${esc(f?.name)} failed</h3>
      <p class="mono" style="margin:8px 0 12px;white-space:pre-wrap">${esc(s.detail || f?.error || "")}</p>
      ${d.pending && S.settings?.mode === "manual" ? handoffBox(d) : ""}
      <button class="btn ghost" onclick="act('resume')">Retry this step</button></div>`;
  }
  if (s.status === "done") {
    const m = s.memory_write || {};
    return `<div class="card action done"><div class="row"><h3 style="color:var(--accent)">Saved to memory · post ${esc(m.post_id)}</h3><span class="chip">${esc(m.angles_queued)} angles queued</span><span class="chip">${m.embedded ? "embedded for dedup" : "not embedded"}</span></div>
      <p class="muted" style="margin:6px 0 0">Package: <span class="mono">${esc(d.outputs.A10?.path || "")}</span></p></div>${renderKit(d)}${renderStudio(d)}`;
  }
  if (s.status === "rejected") return `<div class="card action"><h3>Rejected</h3><p class="muted" style="margin:6px 0 0">${esc(s.note)}. Nothing was saved.</p></div>`;
  return "";
}

async function autoResume() { await setMode("auto"); act("resume"); }

function gauge(p, c) { return `<div class="gauge" style="--p:${p};--c:${c}"><span>${p}%</span></div>`; }
function renderG1(s) {
  const rec = s.recommendation;

    <p class="muted" style="margin:4px 0 0">Confidence = how sure Claude is the post will land. Freshness = distance from your past posts.</p>
    ${rec ? `<div class="rec"><span class="badge">CLAUDE RECOMMENDS</span><div class="grow"><b>${esc(rec.title)}</b><div class="muted" style="margin-top:4px">${esc(rec.reason || "")}</div></div>

    <div class="angles">${s.angles.map(a => {

      const fresh = a.max_similarity == null ? "unchecked" : a.max_similarity < 0.4 ? "fresh" : a.max_similarity < 0.7 ? "related" : "close to a past post";
      return `<div class="angle ${a.recommended ? "recd" : ""}">${a.recommended ? `<span class="ribbon">RECOMMENDED</span>` : ""}
        <div class="conf">${gauge(p, col)}<div><div class="row" style="gap:6px"><span class="chip">#${a.n}</span><span class="chip">${esc(a.post_type)}</span></div>
          <div class="dim" style="font-size:12px;margin-top:4px">freshness: ${fresh}${a.max_similarity != null ? ` (${Number(a.max_similarity).toFixed(2)})` : ""}</div></div></div>
        <div class="ttl">${esc(a.title)}</div><div class="hook">${esc(a.hook)}</div>
        ${a.why ? `<div class="why">${esc(a.why)}</div>` : ""}
        <div style="margin-top:auto"><button class="btn ${a.recommended ? "" : "ghost"}" onclick="pick(${a.n})">Use this angle</button></div></div>`;
    }).join("")}</div></div>`;
}
function fmtPost(t) { return esc(t).replace(/(^|\s)(#[A-Za-z0-9_]+)/g, '$1<span class="tag2">$2</span>'); }
function scores(sc) {
  if (!sc) return "";
  return `<div style="display:grid;gap:6px;margin-top:10px">${Object.entries(sc).map(([k, v]) => `<div class="score5"><span class="muted">${esc(k)}</span><div class="bar"><i style="width:${v * 20}%"></i></div><span class="mono">${v}/5</span></div>`).join("")}</div>`;

      </div></div></div>${renderKit(d)}${renderStudio(d)}`;

}
function wrapLines(ctx, text, maxW) {
  const words = String(text || "").split(/\s+/), lines = []; let cur = "";
  for (const w of words) { const t = cur ? cur + " " + w : w; if (ctx.measureText(t).width > maxW && cur) { lines.push(cur); cur = w; } else cur = t; }
  if (cur) lines.push(cur); return lines;
}
function drawGfx() {
  const cv = $("#gfx"); if (!cv || !S.d) return;
  const ctx = cv.getContext("2d"), W = 1200, H = 627, g = graphicSpec(S.d), style = S.gstyle || g.style;
  const repo = S.d.outputs.A01 ? `${S.d.outputs.A01.owner}/${S.d.outputs.A01.repo}` : "";
  const mono = '"Cascadia Code","JetBrains Mono",Consolas,monospace', sans = '"Segoe UI",system-ui,sans-serif';
  ctx.clearRect(0, 0, W, H);
  if (style === "terminal") {
    ctx.fillStyle = "#070b10"; ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = "#0e151e"; ctx.beginPath(); ctx.roundRect(60, 60, W - 120, H - 150, 18); ctx.fill();
    ctx.fillStyle = "#131c27"; ctx.beginPath(); ctx.roundRect(60, 60, W - 120, 46, [18, 18, 0, 0]); ctx.fill();
    ["#ff5f57", "#febc2e", "#28c840"].forEach((c, i) => { ctx.fillStyle = c; ctx.beginPath(); ctx.arc(92 + i * 26, 83, 7, 0, 7); ctx.fill(); });
    ctx.fillStyle = "#5b6b80"; ctx.font = `18px ${mono}`; ctx.fillText(repo || "shaheersec", 190, 89);
    ctx.font = `bold 44px ${mono}`; let y = 180;
    ctx.fillStyle = "#3ee6a8"; ctx.fillText("$", 100, y);
    ctx.fillStyle = "#e6edf3";
    for (const l of wrapLines(ctx, g.headline, W - 260).slice(0, 4)) { ctx.fillText(l, 145, y); y += 60; }
    if (g.subline) { ctx.font = `24px ${mono}`; ctx.fillStyle = "#8b9bb0"; for (const l of wrapLines(ctx, "# " + g.subline, W - 240).slice(0, 2)) { ctx.fillText(l, 100, y + 14); y += 34; } }
    ctx.fillStyle = "#3ee6a8"; ctx.fillRect(100, Math.min(y + 30, H - 130), 22, 34);
  } else if (style === "quote") {
    const gr = ctx.createLinearGradient(0, 0, W, H); gr.addColorStop(0, "#0b1320"); gr.addColorStop(1, "#0d2a2a"); ctx.fillStyle = gr; ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = "#3ee6a8"; ctx.fillRect(80, 110, 8, 300);
    ctx.font = `bold 54px ${sans}`; ctx.fillStyle = "#ffffff"; let y = 170;
    for (const l of wrapLines(ctx, g.headline, W - 240).slice(0, 4)) { ctx.fillText(l, 120, y); y += 68; }
    if (g.subline) { ctx.font = `28px ${sans}`; ctx.fillStyle = "#9fb3c8"; for (const l of wrapLines(ctx, g.subline, W - 240).slice(0, 2)) { ctx.fillText(l, 120, y + 20); y += 40; } }
  } else {
    ctx.fillStyle = "#070b10"; ctx.fillRect(0, 0, W, H);
    const gr = ctx.createRadialGradient(W * .75, H * .3, 10, W * .75, H * .3, 500); gr.addColorStop(0, "#3ee6a822"); gr.addColorStop(1, "#0000"); ctx.fillStyle = gr; ctx.fillRect(0, 0, W, H);
    const stat = g.stat || (g.headline.match(/\$?\d[\d,.%]*|\b[A-Z]{2,}\b/) || [""])[0] || "!";
    ctx.font = `bold 170px ${mono}`; ctx.fillStyle = "#3ee6a8"; ctx.fillText(stat, 90, 260);
    ctx.font = `bold 44px ${sans}`; ctx.fillStyle = "#e6edf3"; let y = 350;
    for (const l of wrapLines(ctx, g.headline, W - 180).slice(0, 3)) { ctx.fillText(l, 95, y); y += 56; }
    if (g.subline) { ctx.font = `26px ${sans}`; ctx.fillStyle = "#8b9bb0"; ctx.fillText(wrapLines(ctx, g.subline, W - 180)[0], 95, y + 10); }
  }
  ctx.font = `bold 22px ${mono}`; ctx.fillStyle = "#3ee6a8"; ctx.fillText("@ShaheerSec", 80, H - 40);
  ctx.font = `18px ${mono}`; ctx.fillStyle = "#5b6b80"; const r = repo ? "github.com/" + repo : ""; ctx.fillText(r, W - 80 - ctx.measureText(r).width, H - 40);
  const url = cv.toDataURL("image/png");
  const img = $("#liImg"); if (img) img.src = url;
  const ki = $("#kitImg"); if (ki) ki.src = url;
  if (S.d?.kit && !S.d.kit.has_png && S.kitSaved !== S.cur) saveKit(false);   // first view: save the kit automatically
}
function downloadGfx() { const a = document.createElement("a"); a.download = `${S.cur}-graphic.png`; a.href = $("#gfx").toDataURL("image/png"); a.click(); }
function copyText(i) { navigator.clipboard.writeText($("#ip" + i).textContent).then(() => toast("Prompt copied. Paste it into Canva or your image tool.", true)); }

/* ---------------- stage inspector ---------------- */
const ev = e => `<span class="chip ev">${esc(e.source_path)}@${esc(e.source_ref)}</span>`;
const DETAIL = {
  A01: r => `<div class="tiles"><div class="tile"><div class="n">${esc(r.owner)}/${esc(r.repo)}</div><div class="l">repo</div></div><div class="tile"><div class="n">${esc(r.file_count)}</div><div class="l">files</div></div>
      <div class="tile"><div class="n">${esc((r.head_sha || "").slice(0, 7))}</div><div class="l">head commit</div></div><div class="tile"><div class="n">${esc(r.source_type)}</div><div class="l">source${r.cache_hit ? " · cached" : ""}</div></div></div>
    <div class="sect">Key files read (${r.key_files.length})</div><div class="row">${r.key_files.map(k => `<span class="chip ev">${esc(k.path)} · ${k.chars}</span>`).join("")}</div>
    <div class="sect">Recent commits</div>${(r.commits || []).map(c => `<div style="font-size:13px"><span class="mono dim">${esc((c.sha || "").slice(0, 7))}</span> ${esc(c.subject || c.message || "")}</div>`).join("") || '<div class="dim">none (zip without history)</div>'}
    <div class="sect">File tree</div><div class="tree">${r.tree.map(esc).join("<br>")}</div>`,
  A02: m => `<div class="tiles"><div class="tile"><div class="n">${m.past_post_count}</div><div class="l">past posts (dedup)</div></div><div class="tile"><div class="n">${(m.queued_angles || []).length}</div><div class="l">queued angles, this repo</div></div></div>
    ${(m.queued_angles || []).map(a => `<div style="font-size:13px">• ${esc(a.title)}</div>`).join("")}`,
  A03: a => `<p style="margin-top:0"><b>Summary.</b> ${esc(a.summary)}</p><p><b>Purpose.</b> ${esc(a.purpose)}</p>` +
    ["components", "decisions", "security_notes", "limitations"].map(k => (a[k] || []).length ? `<div class="sect">${k.replace("_", " ")} (${a[k].length})</div>
      <div class="grid2">${a[k].map(f => `<div class="find"><b>${esc(f.title)}</b><p>${esc(f.detail)}</p><div class="row">${f.evidence.map(ev).join("")}</div></div>`).join("")}</div>` : "").join(""),
  A04: s => `${s.recommendation ? `<div class="rec" style="margin-top:0"><span class="badge">RECOMMENDED</span><div><b>${esc(s.recommendation.title)}</b><div class="muted">${esc(s.recommendation.reason || "")}</div></div></div>` : ""}
    <div class="tiles" style="margin-top:12px">${Object.entries(s.counts || {}).map(([k, v]) => `<div class="tile"><div class="n">${v}</div><div class="l">${esc(k)}</div></div>`).join("")}</div>
    ${(s.angles || []).map(a => `<div class="find" style="margin-bottom:8px;${a.dedup_status === "rejected" ? "opacity:.5" : ""}"><div class="row"><span class="chip">${Math.round(a.score * 100)}% confident</span><span class="chip">${esc(a.post_type)}</span><span class="chip">${esc(a.dedup_status)}${a.max_similarity != null ? " · sim " + Number(a.max_similarity).toFixed(2) : ""}</span></div>
      <b style="margin-top:6px">${esc(a.title)}</b><p>${esc(a.summary)}</p>${a.why ? `<p class="muted">${esc(a.why)}</p>` : ""}<div class="row">${a.evidence.map(ev).join("")}</div></div>`).join("")}`,
  G1: a => `<div class="find"><b>${esc(a.title)}</b><p>${esc(a.summary)}</p><p class="muted">Hook: ${esc(a.hook)}</p></div>`,
  A05: s => `<div class="tiles"><div class="tile"><div class="n">${esc(s.format)}</div><div class="l">format</div></div><div class="tile"><div class="n">${s.length_target}</div><div class="l">target chars</div></div>
      <div class="tile"><div class="n">${s.confidence != null ? Math.round(s.confidence * 100) + "%" : "—"}</div><div class="l">confidence</div></div><div class="tile"><div class="n">${s.voice_used ? "yes" : "no"}</div><div class="l">your voice used</div></div></div>
    ${s.rationale ? `<p class="muted">${esc(s.rationale)}</p>` : ""}<div class="sect">Hook</div><div class="find"><b>${esc(s.hook)}</b></div>
    <div class="sect">Beats</div><div class="beats">${s.beats.map((b, i) => `<div class="beat"><span>${i + 1}</span><div>${esc(b)}</div></div>`).join("")}</div>
    <div class="sect">CTA</div><div>${esc(s.cta)}</div><div class="sect">Hashtags · evidence</div><div class="row">${s.hashtags.map(h => `<span class="chip">${esc(h)}</span>`).join("")} ${s.evidence.map(ev).join("")}</div>`,
  A06: v => `<p class="muted" style="margin-top:0">${esc(v.rationale)}</p><div class="grid2">${v.shots.map((s, i) => `<div class="find"><div class="row"><span class="chip">${i + 1} · ${esc(s.kind)}</span><span class="chip">${s.minutes} min</span></div>
      <b style="margin-top:6px">${esc(s.shot)}</b><p>${esc(s.how)}</p>${s.file_path ? `<span class="chip ev">${esc(s.file_path)} ${esc(s.lines || "")}</span>` : ""}</div>`).join("")}</div>
    ${v.graphic ? `<div class="sect">Graphic plan</div><div class="find"><span class="chip">${esc(v.graphic.style)}</span><b style="margin-top:6px">${esc(v.graphic.headline)}</b><p>${esc(v.graphic.subline || "")}</p></div>` : ""}`,
  A07: d => `<div class="tiles"><div class="tile"><div class="n">${d.chars}</div><div class="l">chars (target ${d.length_target})</div></div><div class="tile"><div class="n">${d.claims.length}</div><div class="l">claims</div></div><div class="tile"><div class="n">${(d.notes || []).length}</div><div class="l">notes for critic</div></div></div>
    <div class="li"><div class="body">${fmtPost(d.text)}</div></div><div class="sect">Claims</div>${d.claims.map(c => `<div style="font-size:13px;margin-bottom:6px">${esc(c.claim)} ${ev(c)}</div>`).join("")}`,
  A08: c => `<div class="row"><b>Verdict</b><span class="chip">${esc(c.verdict)}</span></div>${scores(c.scores)}<div class="sect">Flags (${c.flags.length})</div><div style="display:grid;gap:8px">${c.flags.map(f => `<div class="flag">
      <div class="row"><span class="sev ${f.severity}">${f.severity}</span><span class="chip">${esc(f.source)}</span></div><div style="margin-top:6px"><span class="q">${esc(f.quote)}</span></div>
      <div style="margin-top:6px">${esc(f.issue)}</div><div class="muted" style="margin-top:4px">→ ${esc(f.suggestion)}</div></div>`).join("") || '<div class="dim">clean</div>'}</div>`,
  A09: r => `<div class="tiles"><div class="tile"><div class="n">${r.chars}</div><div class="l">chars</div></div><div class="tile"><div class="n">${r.changes.filter(c => c.action === "applied").length}/${r.changes.length}</div><div class="l">flags applied</div></div><div class="tile"><div class="n">${r.unresolved.length}</div><div class="l">unresolved</div></div></div>
    ${r.changes.map(c => `<div class="flag" style="margin-bottom:8px"><span class="chip">${esc(c.action)}</span> <span class="q">${esc(c.quote)}</span><div class="muted" style="margin-top:6px">${esc(c.note)}</div></div>`).join("")}`,
  A10: p => `<div class="tiles"><div class="tile"><div class="n">${p.chars}</div><div class="l">chars</div></div><div class="tile"><div class="n">${p.words}</div><div class="l">words</div></div><div class="tile"><div class="n">${p.evidence_checked}</div><div class="l">evidence checked</div></div></div>
    <div class="mono muted" style="font-size:12.5px;margin-bottom:10px">${esc(p.path)}</div>${S.d?.package_md ? `<pre class="json" style="white-space:pre-wrap">${esc(S.d.package_md)}</pre>` : ""}`,
  A11: m => `<div class="tiles">${Object.entries(m).map(([k, v]) => `<div class="tile"><div class="n" style="font-size:14px">${esc(v)}</div><div class="l">${esc(k.replace(/_/g, " "))}</div></div>`).join("")}</div>`,
};
function renderInspect(d) {
  const tags = ["A01", "A02", "A03", "A04", "G1", "A05", "A06", "A07", "A08", "A09", "A10", "A11"];
  const avail = tags.filter(t => d.outputs[t]); if (!avail.length) return "";
  const sel = S.sel && d.outputs[S.sel] ? S.sel : avail[avail.length - 1];
  const st = d.stages.find(s => s.tag === sel);
  let body; try { body = DETAIL[sel] ? DETAIL[sel](d.outputs[sel]) : ""; } catch (e) { body = ""; }
  if (!body) body = `<pre class="json">${esc(JSON.stringify(d.outputs[sel], null, 2))}</pre>`;
  return `<div class="card" id="inspect"><div class="tabs">${tags.map(t => `<button class="tab ${t === sel ? "on" : ""}" ${d.outputs[t] ? "" : "disabled"} onclick="selTag('${t}')">${t} ${SHORT[t]}</button>`).join("")}
    <span class="grow"></span><button class="tab" onclick="$('#detailBody').innerHTML='<pre class=json>'+esc(JSON.stringify(S.d.outputs['${sel}'],null,2))+'</pre>'">raw JSON</button></div>
    <div class="row" style="margin-bottom:12px"><h2>${esc(sel)} · ${esc(st?.name || "")}</h2><span class="muted">${esc(st?.what || "")}</span></div><div id="detailBody">${body}</div></div>`;
}

/* ---------------- views ---------------- */
function renderRun() {
  const d = S.d;
  if (!d) return `<div class="empty"><span class="spin"></span> loading…</div>`;
  if (d.starting) return `<div class="card action running"><div class="row"><span class="spin"></span><h3>${esc(S.cur)}: A01 is fetching the repo…</h3></div></div>`;
  const s = d.summary, k = d.busy ? "running" : s.gate ? "gate" : s.status;
  const label = d.busy ? "agents working" : s.gate ? "your turn · " + s.gate : s.status === "waiting" ? "needs Claude" : s.status;
  const doneN = d.stages.filter(x => ["success", "done", "skipped"].includes(x.status)).length;
  return `<div class="floor-grid"><div class="floor"><div class="floor-head"><div class="grow"><h1>${esc(s.run_id)}</h1><div class="src">${esc(d.source)}</div></div>
      <span class="chip">${doneN}/13 steps</span><span class="pill ${k}">${esc(label)}</span></div>${renderNet(d.stages)}</div>${renderFeed(d)}</div>
    ${renderAction(d)}${renderInspect(d)}`;
}
function renderMemory() {
  const m = S.memory || {posts: [], queued: []};
  return `<div class="card"><div class="row"><h2>Memory</h2><span class="grow"></span><button class="btn ghost sm" onclick="S.mem=false;render()">Close</button></div>
    <div class="sect">Posts (${m.posts.length}) · what dedup compares new angles against</div><div style="display:grid;gap:8px">${m.posts.map(p => `<div class="find">
      <div class="row"><span class="chip">#${p.id}</span><span class="chip">${esc(p.repo_id)}</span><span class="chip">${p.chars} chars</span><span class="chip">${p.embedded ? "embedded" : "no embedding"}</span></div><p style="margin-top:8px">${esc(p.preview)}…</p></div>`).join("") || '<div class="empty">none yet</div>'}</div>
    <div class="sect">Queued angles (${m.queued.length})</div>${m.queued.map(a => `<div style="font-size:13px;margin-bottom:4px"><span class="mono dim">${Math.round((a.score || 0) * 100)}%</span> ${esc(a.title)} <span class="dim">· ${esc(a.repo_id)}</span></div>`).join("") || '<div class="empty">none yet</div>'}</div>`;
}
function render() {
  renderTop();
  const typing = document.activeElement && ["resp", "src"].includes(document.activeElement.id);
  if (typing) return;
  const keepResp = $("#resp")?.value, keepPrompt = $("#promptView")?.innerHTML;
  const streamAtBottom = (() => { const e = $("#stream"); return !e || e.scrollTop + e.clientHeight >= e.scrollHeight - 30; })();
  const logEl = $("#log"), logAtBottom = !logEl || logEl.scrollTop + logEl.clientHeight >= logEl.scrollHeight - 20;
  const y = document.querySelector(".body").scrollTop;
  $("#view").innerHTML = S.mem ? renderMemory() : S.cur ? renderRun() : renderNew();
  document.querySelector(".body").scrollTop = y;
  if (keepResp && $("#resp")) $("#resp").value = keepResp;
  if (keepPrompt && $("#promptView")) $("#promptView").innerHTML = keepPrompt;
  if (streamAtBottom && $("#stream")) $("#stream").scrollTop = 1e9;
  if (logAtBottom && $("#log")) $("#log").scrollTop = 1e9;
  wireDrop(); drawGfx();
}

/* ---------------- actions ---------------- */
async function act(a, body) { try { await post(`/api/runs/${encodeURIComponent(S.cur)}/${a}`, body); refresh(); } catch (e) { toast(e.message); } }
const pick = n => act("pick", {n});
function approveRun() { if (confirm("Approve this post and save it to memory? Future angles will be deduped against it.")) act("approve"); }
function rejectRun() { const r = prompt("Reason for rejecting (one line):", ""); if (r !== null) act("reject", {reason: r}); }
const getPrompt = () => api(`/api/runs/${encodeURIComponent(S.cur)}/prompt`);
async function copyPrompt() { try { const p = await getPrompt(); await navigator.clipboard.writeText(p.text); toast(`Copied ${p.text.length.toLocaleString()} characters.`, true); } catch (e) { toast("Copy failed: " + e.message); } }
async function viewPrompt() { try { const p = await getPrompt(); $("#promptView").innerHTML = `<div class="sect">${esc(p.path)}</div><pre class="json" style="white-space:pre-wrap">${esc(p.text)}</pre>`; } catch (e) { toast(e.message); } }
async function sendResp() {
  const t = $("#resp").value.trim(); if (!t) return toast("Paste Claude's JSON answer first.");
  try { await post(`/api/runs/${encodeURIComponent(S.cur)}/response`, {text: t}); $("#resp").value = ""; toast("Answer saved, continuing…", true); refresh(); } catch (e) { toast(e.message); }
}

window.addEventListener("hashchange", () => { const h = decodeURIComponent(location.hash.slice(1)) || null; if (h !== S.cur) go(h); });
S.cur = decodeURIComponent(location.hash.slice(1)) || null;
render(); refresh();
</script>
